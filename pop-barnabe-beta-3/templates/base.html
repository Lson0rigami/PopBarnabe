<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Barnabé Ops{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-logo-wrap">
                    <img class="brand-logo" src="{{ url_for('static', filename='img/logo-barnabe.png') }}" alt="Logo Empadinhas Barnabé">
                </span>
                <span class="brand-text">
                    <strong>Barnabé Ops</strong>
                    <small>POPs, rotinas e checklist do estoque</small>
                </span>
            </a>

            <nav class="nav" aria-label="Navegação principal">
                <a href="{{ url_for('index') }}">Hoje</a>
                <a href="{{ url_for('rotinas') }}">Rotinas</a>
                <a href="{{ url_for('procedimentos') }}">POPs</a>
                <a href="{{ url_for('sabores') }}">Sabores</a>
                <a href="{{ url_for('glossario') }}">Glossário</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Empadinhas Barnabé • Beta 4 visual • Checklist local no tablet</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
