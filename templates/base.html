<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0878d8">
    <title>{% block title %}Barnabé Ops{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=app_version) }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-logo-wrap"><img class="brand-logo" src="{{ url_for('static', filename='img/logo-barnabe.png', v=app_version) }}" alt="Logo Empadinhas Barnabé"></span>
                <span class="brand-text"><strong>Barnabé Ops</strong><small>Operação • POPs • Rotinas</small></span>
            </a>
            <nav class="nav" aria-label="Navegação principal">
                <a href="{{ url_for('index') }}">Operação</a>
                <a href="{{ url_for('painel') }}">Painel</a>
                <a href="{{ url_for('rh_dashboard') }}">RH</a>
                <a href="{{ url_for('rotinas') }}">Rotinas</a>
                <a href="{{ url_for('procedimentos') }}">POPs</a>
                <a href="{{ url_for('sabores') }}">Sabores</a>
                <a href="{{ url_for('glossario') }}">Glossário</a>
            </nav>
        </div>
    </header>

    <main class="container">{% block content %}{% endblock %}</main>

    <footer class="footer"><p>Empadinhas Barnabé • Barnabé Ops 4.0 • Operação, histórico e indicadores</p></footer>

    <div class="ops-modal" data-ops-modal hidden>
        <div class="ops-modal-backdrop" data-modal-close></div>
        <section class="ops-sheet" role="dialog" aria-modal="true" aria-labelledby="ops-modal-title">
            <div class="sheet-handle"></div>
            <button class="sheet-close" type="button" data-modal-close aria-label="Fechar">×</button>
            <div class="ops-sheet-content" data-modal-content></div>
        </section>
    </div>
    <div class="toast-stack" data-toast-stack aria-live="polite"></div>
    <canvas class="confetti-canvas" data-confetti-canvas></canvas>

    <script>window.BARNABE = { apiBase: "{{ request.script_root }}", version: "{{ app_version }}" };</script>
    <script src="{{ url_for('static', filename='js/app.js', v=app_version) }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
